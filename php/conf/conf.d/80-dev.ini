; ---------------------------------------------------------------------------
; Development-only overrides. This file is git-ignored, so it exists only on
; local machines and never reaches stage / production — there the hardened
; defaults from 10-waddle.ini stand. It sorts after 10-waddle.ini, so the
; values here win locally.
; ---------------------------------------------------------------------------

; Surface every error while developing.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
zend.exception_ignore_args = Off
zend.assertions = 1
mysqlnd.collect_memory_statistics = On

; Pick up file edits immediately (no manual OPcache resets during development).
opcache.validate_timestamps = 1

; Aggressively collect dead sessions so timeout bugs surface early.
session.gc_probability = 1
session.gc_divisor = 1
