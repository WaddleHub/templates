; ---------------------------------------------------------------------------
; Waddle PHP baseline. Loaded in every environment (local and remote) and is the
; production-safe default. Development-only overrides live in 80-dev.ini, which
; is git-ignored and therefore present only on local machines — so the hardened
; values below are what actually run on stage / production servers.
;
; To add your own settings, drop a file that sorts after this one into this
; directory, e.g. 99-custom.ini, or modify 80-dev.ini directly if you need
; to override values for local development. You can also edit this file
; directly for shared settings across all environments, but a custom file
; should be preferred since it's cleaner.
; ---------------------------------------------------------------------------

; --- Sessions --------------------------------------------------------------
; NOTE: raising session.sid_length to 256 is encouraged if your application
; supports it.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.hash_function = "sha256"
session.save_path = "{{project_path 'php/data/sessions'}}"
session.gc_maxlifetime = 86400
{{#if (version_compare tags.php.version.raw '<' '8.4.0')}}
session.sid_length = 64
session.sid_bits_per_character = 6
{{/if}}
{{#if ssl.enabled}}
session.cookie_secure = 1
{{/if}}

; --- Error handling --------------------------------------------------------
; Production-safe defaults; 80-dev.ini turns display on for local development.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "{{project_path 'php/log/error.log'}}"
zend.exception_ignore_args = On

; --- Hardening -------------------------------------------------------------
; Do not advertise PHP or its version, forbid remote-code includes and runtime
; extension loading, and never let PHP-FPM execute a path that is not a real
; .php file (cgi.fix_pathinfo = 0 — Nginx passes an exact SCRIPT_FILENAME).
expose_php = Off
allow_url_include = Off
enable_dl = Off
cgi.fix_pathinfo = 0
mail.add_x_header = Off

{{#if public.php.harden}}
; --- Optional hardening (opt-in) -------------------------------------------
; Rendered because this project has the "Harden PHP" option enabled. These
; values go beyond the always-on baseline above. They are a good fit for custom
; applications where you control the code, but can break some packaged
; platforms (large uploads, long-running installers, or code that reads $_ENV),
; which is why they are off by default for everything except the webstack and
; blank blueprints. Raise or relax any of them in a 99-custom.ini as you see fit.
;
; Deliberately NOT included here but could be appended to a 99-custom.ini
; for even stricter security:
;
; disabling exec/system/shell_exec/passthru/proc_open/popen, open_basedir,
; allow_url_fopen = Off, and opcache.jit. These break Composer and several
; platform installers, so they are left off by design.

; Drop the environment layer from the request superglobals: $_ENV is no longer
; populated from the process environment, so a request cannot smuggle values in
; through it. Application code should read configuration via getenv() (still
; works) or $_SERVER instead of $_ENV.
variables_order = "GPCS"

; Log everything, never render an error as HTML, and don't collapse repeats —
; display is already Off in the baseline, so this only affects the error log.
error_reporting = E_ALL
html_errors = Off
ignore_repeated_errors = Off

; Tighter ceilings to blunt resource-exhaustion abuse. post_max_size stays a
; little above upload_max_filesize so an upload plus its form fields still fit.
max_execution_time = 60
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 16M
max_file_uploads = 20
{{/if}}

; --- OPcache ---------------------------------------------------------------
; Production default: trust the cache and skip per-request file mtime checks.
; 80-dev.ini re-enables validation locally so edits are picked up immediately.
opcache.validate_timestamps = 0

; --- Performance -----------------------------------------------------------
; A larger realpath cache noticeably helps file-heavy frameworks (Magento,
; Laravel, …) by avoiding repeated stat() calls on the same paths.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; --- Misc ------------------------------------------------------------------
memory_limit = {{public.php.ram}}M
default_charset = "UTF-8"
date.timezone = "{{advanced.php.timezone}}"

{{#if public.mail.enabled}}
sendmail_path = "/usr/bin/msmtp -C {{project_path 'mail/conf/msmtprc'}} -t"
{{/if}}

{{#if (is_equal public.website.platform 'typo3')}}
max_execution_time = 240
max_input_vars = 1500

; SystemEnvironmentBuilder refuses to boot under a CGI-like SAPI unless
; cgi.fix_pathinfo = 1, so we flip it back on.
cgi.fix_pathinfo = 1
{{/if}}
