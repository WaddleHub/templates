; OPcache sizing and behaviour, shared by every environment. The
; environment-specific opcache.validate_timestamps toggle lives in 10-waddle.ini
; (off, for production) and 80-dev.ini (on, for local development).
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 65407
opcache.revalidate_freq = 0
