; PHP-FPM pool overrides. php/script/run.sh appends an include for this
; directory to php-fpm.conf *after* the stock php-fpm.d/www.conf, so the [www]
; settings below override that default pool — binding it to the port Nginx talks
; to and writing logs into the project tree.

[global]
error_log = "{{project_path 'php/log/php-fpm.log'}}"

[www]
; Listen on all interfaces (bare port), not a single resolved address. Under
; isolate_networks the php container is multi-homed (joins {project}-web,
; {project}-db, ...), so binding to `php:PORT` would pin FPM to just one
; interface while Nginx reaches it over the -web network — causing connection
; refused / 502.
listen = {{public.php.fastcgi_port}}
user = {{get_daemon_user public.php.docker}}
group = {{get_daemon_group public.php.docker}}

; Defence in depth: only ever hand .php files to the interpreter (Nginx already
; routes nothing else to FPM).
security.limit_extensions = .php

; Disable process-control functions for web requests. pcntl_* has no legitimate
; use in a request context and is a common attack primitive. php_admin_value
; scopes this to FPM only, so CLI workers (Magento queue consumers, Laravel
; Horizon) can still use pcntl_signal for graceful shutdown.
php_admin_value[disable_functions] = "pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority"
