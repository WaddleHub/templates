##
# Source: https://wintercms.com/docs/v1.2/docs/setup/configuration
##
{{#if public.nginx.letsencrypt}}
acme_issuer letsencrypt {
    uri https://acme-v02.api.letsencrypt.org/directory;
    state_path "{{project_path 'ssl/letsencrypt'}}";
    accept_terms_of_service;
    # Verify the ACME server.
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}
map $ssl_server_name $ssl_cert {
{{remote_acme_cert_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
}
map $ssl_server_name $ssl_cert_key {
{{remote_acme_key_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
}
{{/if}}
server {
  root "{{project_path 'website/src'}}";
  index index.php;
  server_name {{combined_domain_name}};
  # Load additional files with custom directives.
  include "{{project_path 'nginx/conf/extras'}}/*.conf";

  {{#if public.nginx.http_port}}
  listen {{public.nginx.http_port}};
  listen [::]:{{public.nginx.http_port}};
  {{/if}}

  {{#if ssl.enabled}}
  # SSL port.
  listen {{public.nginx.https_port}} ssl;
  listen [::]:{{public.nginx.https_port}} ssl;

  {{#if public.nginx.letsencrypt}}
  ssl_certificate $ssl_cert;
  ssl_certificate_key $ssl_cert_key;
  ssl_certificate_cache max=2;
  {{else}}
  # RSA certificate.
  ssl_certificate "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
  ssl_certificate_key "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
  {{/if}}

  # Redirect non-https traffic to https.
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }
  {{/if}}

  {{#if public.nginx.harden}}
  include "{{project_path 'nginx/conf/harden.conf'}}";
  {{/if}}

  charset utf-8;

  # Let Winter CMS handle all requests by default.
  location / {
    rewrite ^/.*$ /index.php last;
  }

  error_page 404 = /index.php;

  location ~ ^/favicon\.ico { try_files $uri /index.php; }
  location ~ ^/sitemap\.xml { try_files $uri /index.php; }
  location ~ ^/robots\.txt  { try_files $uri /index.php; }
  location ~ ^/humans\.txt  { try_files $uri /index.php; }

  {{#if public.nginx.letsencrypt}}
  # ACME HTTP-01 challenge. nginx-acme answers this in the post-read phase; the
  # explicit ^~ location just stops the dotfile-deny / regex rules from shadowing it.
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    return 404;
  }
  {{/if}}

  # deny access to hidden files
  location ~ /\. { deny all; }

  # Public storage paths.
  location ~ ^/storage/app/uploads/public { try_files $uri 404; }
  location ~ ^/storage/app/media          { try_files $uri 404; }
  location ~ ^/storage/app/resized        { try_files $uri 404; }
  location ~ ^/storage/temp/public        { try_files $uri 404; }

  # Module, plugin and theme assets.
  location ~ ^/modules/.*/assets     { try_files $uri 404; }
  location ~ ^/modules/.*/resources  { try_files $uri 404; }
  location ~ ^/plugins/.*/.*/assets     { try_files $uri 404; }
  location ~ ^/plugins/.*/.*/resources  { try_files $uri 404; }
  location ~ ^/themes/.*/assets     { try_files $uri 404; }
  location ~ ^/themes/.*/resources  { try_files $uri 404; }

  location ~ ^/index\.php {
    fastcgi_pass php:{{public.php.fastcgi_port}};
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
  }
}
