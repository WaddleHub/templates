{{!--
  Rendered empty when mail is off: a copy of this template left in a project after disabling
  mail would otherwise point nginx at the removed `mail` service and stop it from starting.
--}}
{{#if public.mail.enabled}}
##
# Reverse proxy for the MailCatcher web UI (local development only).
##
server {
  {{#if public.nginx.http_port}}
  listen {{public.nginx.http_port}};
  listen [::]:{{public.nginx.http_port}};
  {{/if}}

  server_name mail.{{public.website.url}};

  {{#if ssl.enabled}}
  # SSL port.
  listen {{public.nginx.https_port}} ssl;
  listen [::]:{{public.nginx.https_port}} ssl;

  ssl_certificate "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
  ssl_certificate_key "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";

  # Redirect non-https traffic to https.
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }
  {{/if}}

  location / {
    # Proxy to the MailCatcher service by its Docker container hostname. The UI
    # streams newly received mail over a WebSocket, so the upgrade headers below
    # are required for live updates to work.
    proxy_pass http://mail:{{public.mailcatcher.http_port}};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
{{/if}}
