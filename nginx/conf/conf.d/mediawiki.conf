##
# Source: https://www.mediawiki.org/wiki/Manual:Short_URL/Nginx
##
{{#if public.nginx.letsencrypt}}
acme_issuer letsencrypt {
    uri https://acme-v02.api.letsencrypt.org/directory;
    state_path "{{project_path 'ssl/letsencrypt'}}";
    accept_terms_of_service;
    # Verify the ACME server.
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}
map $ssl_server_name $ssl_cert {
{{remote_acme_cert_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
}
map $ssl_server_name $ssl_cert_key {
{{remote_acme_key_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
}
{{/if}}
server {
  root "{{project_path 'website/src'}}";
  server_name {{combined_domain_name}};
  # Load additional files with custom directives.
  include "{{project_path 'nginx/conf/extras'}}/*.conf";

  {{#if public.nginx.http_port}}
  listen {{public.nginx.http_port}};
  listen [::]:{{public.nginx.http_port}};
  {{/if}}

  {{#if ssl.enabled}}
  # SSL port.
  listen {{public.nginx.https_port}} ssl;
  listen [::]:{{public.nginx.https_port}} ssl;

  {{#if public.nginx.letsencrypt}}
  ssl_certificate $ssl_cert;
  ssl_certificate_key $ssl_cert_key;
  ssl_certificate_cache max=2;
  {{else}}
  # RSA certificate.
  ssl_certificate "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
  ssl_certificate_key "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
  {{/if}}

  # Redirect non-https traffic to https.
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }
  {{/if}}

  {{#if public.nginx.harden}}
  include "{{project_path 'nginx/conf/harden.conf'}}";
  {{/if}}

  # Location for wiki's entry points
  location ~ ^/w/(index|load|api|thumb|opensearch_desc|rest)\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass php:{{public.php.fastcgi_port}};
  }

  # Images
  location /w/images {
    # Separate location for images/ so .php execution won't apply
  }

  location /w/images/deleted {
    # Deny access to deleted images folder
    deny all;
  }

  # MediaWiki assets (usually images)
  location ~ ^/w/resources/(assets|lib|src) {
    try_files $uri =404;
    add_header Cache-Control "public";
    expires 7d;
  }

  # Assets, scripts and styles from skins and extensions
  location ~ ^/w/(skins|extensions)/.+\.(css|js|gif|jpg|jpeg|png|svg|wasm|ttf|woff|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public";
    expires 7d;
  }

  # Favicon
  location = /favicon.ico {
    alias /w/images/6/64/Favicon.ico;
    add_header Cache-Control "public";
    expires 7d;
  }

  # Handling for Mediawiki REST API, see https://www.mediawiki.org/wiki/API:REST_API
  location /w/rest.php/ {
    try_files $uri $uri/ /w/rest.php?$query_string;
  }

  # Handling for the article path (pretty URLs)
  location /wiki/ {
    rewrite ^/wiki/(?<pagename>.*)$ /w/index.php;
  }

  # Allow robots.txt
  location = /robots.txt {
  }

  # Redirect root to main page
  location = / {
    return 301 /wiki/Main_Page;
  }

  # Every other entry point will be disallowed.
  location / {
    return 404;
  }

  {{#if public.nginx.letsencrypt}}
  # ACME HTTP-01 challenge. nginx-acme answers this in the post-read phase; the
  # explicit ^~ location just stops the dotfile-deny / regex rules from shadowing it.
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    return 404;
  }
  {{/if}}

  # deny access to hidden files
  location ~ /\. {
    deny all;
  }
}
