{{!--
  Rendered empty when phpMyAdmin is off: a copy of this template left in a project after
  disabling it would otherwise keep serving (or break on) a phpMyAdmin that's gone.
--}}
{{#if public.phpmyadmin.install}}
server {
  root "{{project_path 'phpmyadmin/data/install'}}";
  index index.php;
  server_name db.{{public.website.url}};

  {{#if public.nginx.http_port}}
  listen {{public.nginx.http_port}};
  listen [::]:{{public.nginx.http_port}};
  {{/if}}

  {{#if ssl.enabled}}
  # SSL port.
  listen {{public.nginx.https_port}} ssl;
  listen [::]:{{public.nginx.https_port}} ssl;

  ssl_certificate "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
  ssl_certificate_key "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";

  # Redirect non-https traffic to https.
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }
  {{/if}}

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  # deny access to hidden files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass php:{{public.php.fastcgi_port}};
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
  }
}
{{/if}}
