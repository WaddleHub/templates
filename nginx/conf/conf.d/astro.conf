##
# Source: https://docs.astro.build/en/guides/integrations-guide/node/ (standalone)
##
{{#if public.nginx.letsencrypt}}
acme_issuer letsencrypt {
    uri https://acme-v02.api.letsencrypt.org/directory;
    state_path "{{project_path 'ssl/letsencrypt'}}";
    accept_terms_of_service;
    # Verify the ACME server.
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}
map $ssl_server_name $ssl_cert {
{{remote_acme_cert_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
}
map $ssl_server_name $ssl_cert_key {
{{remote_acme_key_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
}
{{/if}}
server {
  server_name {{combined_domain_name}};
  # Load additional files with custom directives.
  include "{{project_path 'nginx/conf/extras'}}/*.conf";

  {{#if public.nginx.http_port}}
  listen {{public.nginx.http_port}};
  listen [::]:{{public.nginx.http_port}};
  {{/if}}

  {{#if ssl.enabled}}
  # SSL port.
  listen {{public.nginx.https_port}} ssl;
  listen [::]:{{public.nginx.https_port}} ssl;

  {{#if public.nginx.letsencrypt}}
  ssl_certificate $ssl_cert;
  ssl_certificate_key $ssl_cert_key;
  ssl_certificate_cache max=2;
  {{else}}
  # RSA certificate.
  ssl_certificate "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
  ssl_certificate_key "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
  {{/if}}

  # Redirect non-https traffic to https.
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }
  {{/if}}

  {{#if public.nginx.harden}}
  include "{{project_path 'nginx/conf/harden.conf'}}";
  {{/if}}

  proxy_http_version 1.1;
  # The dev server (`astro dev`, on Vite) pushes hot reloads over a WebSocket.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  # In development mode, Vite serves the website's pre-bundled dependencies from a dot-directory
  # (`/node_modules/.vite/deps/`), which the dotfile-deny rules (below, and in harden.conf) would
  # answer with a 403, breaking every page that loads them. `^~` stops nginx from checking regex
  # locations for this prefix. Safe, since nginx serves nothing from disk here, every request goes
  # to Astro, and the standalone server of a build serves nothing from node_modules.
  location ^~ /node_modules/.vite/ {
    proxy_pass http://node:4321;
  }

  # Astro listens on port 4321 (`server.port` in astro.config.mjs).
  location / {
    proxy_pass http://node:4321;
  }

  {{#if public.nginx.letsencrypt}}
  # ACME HTTP-01 challenge. nginx-acme answers this in the post-read phase; the
  # explicit ^~ location just stops the dotfile-deny / regex rules from shadowing it.
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    return 404;
  }
  {{/if}}

  # deny access to hidden files
  location ~ /\. {
    deny all;
  }
}
