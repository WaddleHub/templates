{{#if public.nginx.letsencrypt}}
acme_issuer letsencrypt {
    uri https://acme-v02.api.letsencrypt.org/directory;
    state_path "{{project_path 'ssl/letsencrypt'}}";
    accept_terms_of_service;
    # Verify the ACME server.
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}
map $ssl_server_name $ssl_cert {
{{remote_acme_cert_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
}
map $ssl_server_name $ssl_cert_key {
{{remote_acme_key_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
}
{{/if}}
server {
  root "{{project_path 'website/src'}}/web";
  index index.php index.html index.htm;
  server_name {{combined_domain_name}};
  # Load additional files with custom directives.
  include "{{project_path 'nginx/conf/extras'}}/*.conf";

  {{#if public.nginx.http_port}}
  listen {{public.nginx.http_port}};
  listen [::]:{{public.nginx.http_port}};
  {{/if}}

  {{#if ssl.enabled}}
  # SSL port.
  listen {{public.nginx.https_port}} ssl;
  listen [::]:{{public.nginx.https_port}} ssl;

  {{#if public.nginx.letsencrypt}}
  ssl_certificate $ssl_cert;
  ssl_certificate_key $ssl_cert_key;
  ssl_certificate_cache max=2;
  {{else}}
  # RSA certificate.
  ssl_certificate "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
  ssl_certificate_key "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
  {{/if}}

  # Redirect non-https traffic to https.
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }
  {{/if}}

  {{#if public.nginx.harden}}
  include "{{project_path 'nginx/conf/harden.conf'}}";
  {{/if}}

  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }

  location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
  }

  # Block public access to .txt/.log files (e.g. CHANGELOG.txt leaks the version).
  location ~* \.(txt|log)$ {
    deny all;
  }

  location ~ \..*/.*\.php$ {
    return 403;
  }

  location ~ ^/sites/.*/private/ {
    return 403;
  }

  # Block access to scripts in site files directory.
  location ~ ^/sites/[^/]+/files/.*\.php$ {
    deny all;
  }

  {{#if public.nginx.letsencrypt}}
  # ACME HTTP-01 challenge. nginx-acme answers this in the post-read phase; the
  # explicit ^~ location just stops the dotfile-deny / regex rules from shadowing it.
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    return 404;
  }
  {{/if}}

  # Allow "Well-Known URIs" as per RFC 5785
  location ~* ^/.well-known/ {
    allow all;
  }

  # Block access to "hidden" files and directories whose names begin with a
  # period. This includes directories used by version control systems such
  # as Subversion or Git to store control files.
  location ~ (^|/)\. {
    return 403;
  }

  location / {
    try_files $uri /index.php?$query_string;
  }

  location @rewrite {
    rewrite ^ /index.php;
  }

  # Don't allow direct access to PHP files in the vendor directory.
  location ~ /vendor/.*\.php$ {
    deny all;
    return 404;
  }

  # Protect files and directories from prying eyes.
  location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|/(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|/#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
    deny all;
    return 404;
  }

  # In Drupal 8, we must also match new paths where the '.php' appears in
  # the middle, such as update.php/selection. The rule we use is strict,
  # and only allows this pattern with the update.php front controller.
  # This allows legacy path aliases in the form of
  # blog/index.php/legacy-path to continue to route to Drupal nodes. If
  # you do not have any paths like that, then you might prefer to use a
  # laxer rule, such as:
  #   location ~ \.php(/|$) {
  # The laxer rule will continue to work if Drupal uses this new URL
  # pattern with front controllers other than update.php in a future
  # release.
  location ~ '\.php$|^/update.php' {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    # Ensure the php file exists. Mitigates CVE-2019-11043
    try_files $fastcgi_script_name =404;
    # Security note: If you're running a version of PHP older than the
    # latest 5.3, you should have "cgi.fix_pathinfo = 0;" in php.ini.
    # See http://serverfault.com/q/627903/94922 for details.
    include fastcgi_params;
    # Block httpoxy attacks. See https://httpoxy.org/.
    fastcgi_param HTTP_PROXY "";
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_intercept_errors on;
    # FastCGI ip / port.
    fastcgi_pass php:{{public.php.fastcgi_port}};
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    try_files $uri @rewrite;
    expires max;
    log_not_found off;
  }

  # Route image style derivatives through Drupal.
  location ~ ^/sites/.*/files/styles/ {
    try_files $uri @rewrite;
  }

  # Handle private files through Drupal. Private file's path can come
  # with a language prefix.
  location ~ ^(/[a-z\-]+)?/system/files/ { # For Drupal >= 7
    try_files $uri /index.php?$query_string;
  }

  # Enforce clean URLs
  # Removes index.php from urls like www.example.com/index.php/my-page --> www.example.com/my-page
  # Could be done with 301 for permanent or other redirect codes.
  if ($request_uri ~* "^(.*/)index\.php/(.*)") {
    return 307 $1$2;
  }
}
