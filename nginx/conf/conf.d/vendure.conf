##
# Source: https://docs.vendure.io/guides/deployment/production-configuration/
##
{{#if public.nginx.letsencrypt}}
acme_issuer letsencrypt {
    uri https://acme-v02.api.letsencrypt.org/directory;
    state_path "{{project_path 'ssl/letsencrypt'}}";
    accept_terms_of_service;
    # Verify the ACME server.
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}
map $ssl_server_name $ssl_cert {
{{remote_acme_cert_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
}
map $ssl_server_name $ssl_cert_key {
{{remote_acme_key_entries}}    default "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
}
{{/if}}
# Vendure's server (port 3000), and the dashboard's dev server (Vite, port 5173, development only).
# Vendure's server proxies the dashboard to the dev server, but not its hot reload WebSocket, so
# WebSocket requests for the dashboard go to the dev server directly.
upstream vendure_server {
  server node:3000;
}
upstream vendure_dashboard_dev {
  server node:5173;
}
map $http_upgrade $vendure_dashboard {
  websocket vendure_dashboard_dev;
  default vendure_server;
}

server {
  server_name {{combined_domain_name}};
  # Load additional files with custom directives.
  include "{{project_path 'nginx/conf/extras'}}/*.conf";

  {{#if public.nginx.http_port}}
  listen {{public.nginx.http_port}};
  listen [::]:{{public.nginx.http_port}};
  {{/if}}

  {{#if ssl.enabled}}
  # SSL port.
  listen {{public.nginx.https_port}} ssl;
  listen [::]:{{public.nginx.https_port}} ssl;

  {{#if public.nginx.letsencrypt}}
  ssl_certificate $ssl_cert;
  ssl_certificate_key $ssl_cert_key;
  ssl_certificate_cache max=2;
  {{else}}
  # RSA certificate.
  ssl_certificate "{{project_path 'ssl'}}/{{ssl.cert_name}}.crt";
  ssl_certificate_key "{{project_path 'ssl'}}/{{ssl.cert_name}}.key";
  {{/if}}

  # Redirect non-https traffic to https.
  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }
  {{/if}}

  {{#if public.nginx.harden}}
  include "{{project_path 'nginx/conf/harden.conf'}}";
  {{/if}}

  # Vendure's own upload limit for assets (`assetOptions.uploadMaxFileSize`, 20 MB by default).
  client_max_body_size 20m;

  proxy_http_version 1.1;
  # The dashboard's dev server (Vite, reached through Vendure's server) pushes hot reloads over a
  # WebSocket.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  # Vendure has no front end of its own (a storefront is a separate app using its Shop API), so
  # send visitors of / to its dashboard.
  location = / {
    return 302 /dashboard/;
  }

  # In development, the dashboard's dev server (Vite) serves its pre-bundled dependencies from a
  # dot-directory (`/dashboard/node_modules/.vite/deps/`), which the dotfile-deny rules (below, and
  # in harden.conf) would answer with a 403, leaving the dashboard blank. `^~` stops nginx from
  # checking regex locations for this prefix. Safe, since nginx serves nothing from disk here, and
  # the dashboard's build in production has no dot-directories.
  location ^~ /dashboard {
    proxy_pass http://$vendure_dashboard;
  }

  # Vendure listens on port 3000 (VENDURE_SERVER_PORT in .env). Its APIs (/shop-api, /admin-api),
  # the dashboard (/dashboard), assets (/assets) and, with mail turned off, the mailbox (/mailbox).
  location / {
    proxy_pass http://vendure_server;
  }

  {{#if public.nginx.letsencrypt}}
  # ACME HTTP-01 challenge. nginx-acme answers this in the post-read phase; the
  # explicit ^~ location just stops the dotfile-deny / regex rules from shadowing it.
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    return 404;
  }
  {{/if}}

  # deny access to hidden files
  location ~ /\. {
    deny all;
  }
}
