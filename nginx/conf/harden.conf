##
# Waddle Nginx hardening partial.
#
# This file is rendered and `include`d inside a server block ONLY when the
# project has the "Harden Nginx" option enabled (public.nginx.harden). Every
# directive here is server-scoped and additive, so it layers on top of each
# platform's own configuration without replacing it.
#
# NOTE on response headers: nginx does not merge `add_header` across nesting
# levels. A `location` that defines its own `add_header` will NOT inherit the
# ones below. A few platform configs (PrestaShop, MediaWiki) set add_header
# inside specific asset locations, so those responses won't carry these headers.
##

# Don't advertise the Nginx version in the Server header or on error pages.
server_tokens off;

# Baseline security response headers. `always` so they are sent on error
# responses too, not just 2xx/3xx.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;

{{#if ssl.enabled}}
# HTTP Strict Transport Security. Only meaningful over TLS. If you ever disable
# SSL for this domain, browsers that have seen this header will refuse plain
# HTTP until the HSTS entry is cleared (e.g. chrome://net-internals/#hsts).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

{{#unless (is_equal public.website.platform 'prestashop')}}
# TLS hardening. PrestaShop ships its own equivalent ssl_* block, so it is
# skipped here to avoid a fatal "duplicate directive" error.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
{{/unless}}
{{/if}}

# Deny access to hidden dotfiles (.git, .env, .htaccess, ...), keeping
# .well-known reachable for ACME / Let's Encrypt challenges.
location ~ /\.(?!well-known).* {
  deny all;
}

{{#if (is_equal public.website.platform 'wordpress')}}
# --- WordPress-specific hardening ------------------------------------------
# Block XML-RPC, a common brute-force and pingback-amplification vector.
location = /xmlrpc.php {
  deny all;
}

# Never expose the main configuration file.
location = /wp-config.php {
  deny all;
}

# Don't execute PHP that was uploaded into the media library.
location ~* /wp-content/uploads/.*\.php$ {
  deny all;
}
{{/if}}
